name: Runtime experiments
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Evidence integrity regression checks
        run: python3 tools/runtime/test_evidence.py
      - name: Fetch, verify and build native Bend probes
        run: python3 tools/runtime/bootstrap.py
      - name: API and fault experiments
        run: python3 tools/runtime/run_probes.py
      - name: Resource ceilings and representation measurements
        run: python3 tools/runtime/measure.py
      - name: Preserve bounded experiment logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-evidence-${{ github.sha }}
          path: |
            build/*.json
            runs/**/*.json
            runs/**/fault.trace
            runs/**/stdout.log
            runs/**/stderr.log
          if-no-files-found: error
          retention-days: 14
